[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "stadium-iot-realtime-platform"
version = "0.1.0"
description = "Real-time Stadium IoT data platform"
requires-python = ">=3.10"
dependencies = [
    "boto3>=1.35.0",
]

[project.scripts]
bronze-ingestion = "jobs.bronze_ingestion:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["ingestion*", "jobs*"]